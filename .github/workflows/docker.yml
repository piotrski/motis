name: Docker

on:
  push:
    branches:
      - patches
  pull_request:
    branches:
      - patches
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container: ghcr.io/motis-project/docker-cpp-build
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          apt-get update
          apt-get install -y build-essential clang cmake ninja-build

      - name: Configure
        run: |
          cmake -GNinja -S . -B build -DMOTIS_MIMALLOC=OFF

      - name: Build tests
        run: cmake --build build --target motis-test

      - name: Run targeted test
        run: ./build/motis-test --gtest_filter=motis.split_trip_id_with_underscores

  build-linux-amd64:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    container: ghcr.io/motis-project/docker-cpp-build
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          apt-get update
          apt-get install -y build-essential clang cmake ninja-build

      - name: Configure
        run: cmake --preset linux-amd64-release

      - name: Build motis
        run: cmake --build --preset linux-amd64-release --target motis

      - name: Package
        run: |
          mkdir -p motis-linux-amd64
          cp build/amd64-release/motis motis-linux-amd64/motis
          tar -cjf motis-linux-amd64/motis-linux-amd64.tar.bz2 -C motis-linux-amd64 motis

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: motis-linux-amd64
          path: motis-linux-amd64/motis-linux-amd64.tar.bz2

  docker:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build-linux-amd64
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: motis-linux-amd64
          path: motis-linux-amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          cache-from: type=registry,ref=ghcr.io/piotrski/motis:buildcache
          cache-to: type=registry,ref=ghcr.io/piotrski/motis:buildcache,mode=max
          tags: |
            ghcr.io/piotrski/motis:${{ github.ref_name }}
            ghcr.io/piotrski/motis:${{ github.sha }}
