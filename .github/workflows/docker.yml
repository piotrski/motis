name: Docker

on:
  push:
    branches:
      - patches
  pull_request:
    branches:
      - patches
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container: ghcr.io/motis-project/docker-cpp-build
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -GNinja -S . -B build -DMOTIS_MIMALLOC=OFF

      - name: Build tests
        run: cmake --build build --target motis-test

      - name: Run targeted test
        run: ./build/motis-test --gtest_filter=motis.split_trip_id_with_underscores

  docker:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/piotrski/motis:${{ github.ref_name }}
            ghcr.io/piotrski/motis:${{ github.sha }}
